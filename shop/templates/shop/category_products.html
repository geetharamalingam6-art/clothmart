<!DOCTYPE html>
<html>
<head>
<title>{{ category.name }} - Electronic Gadget Shop</title>
<style>
body { font-family: Arial; margin: 0; padding: 0; }
.header { background: #333; color: white; padding: 15px; text-align: center; }
.products { display: flex; flex-wrap: wrap; justify-content: center; margin: 20px; }
.product { border: 1px solid #ddd; margin: 10px; padding: 10px; width: 220px; border-radius: 10px; box-shadow: 2px 2px 6px #aaa; text-align: center; }
.product img { width: 100%; height: 180px; object-fit: cover; }
.product h3 { font-size: 18px; margin: 10px 0; }
.product p { font-size: 14px; color: #555; }
.price { color: green; font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>
<div class="header">{{ category.name }}</div>
<div class="products">
{% for product in products %}
<div class="product">
{% if product.image %}
<img src="{{ product.image.url }}" alt="{{ product.name }}">
{% endif %}
<h3>{{ product.name }}</h3>
<p>{{ product.description|truncatewords:15 }}</p>
<div class="price">₹{{ product.price }}</div>
</div>
{% endfor %}
</div>
</body>
</html>
